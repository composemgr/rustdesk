# nginx proxy address - http://172.17.0.1:64333

name: rustdesk
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: docker.io/rustdesk/rustdesk-server-pro:latest
    container_name: rustdesk-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: hbbs
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rustdesk-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-127.0.0.1}:21117
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/21114']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64333:21114/tcp'
      - '21115:21115/tcp'
      - '21116:21116/tcp'
      - '21116:21116/udp'
      - '21118:21118/tcp'
      - '21119:21119/tcp'
    volumes:
      - './volumes/data/server:/root:z'
    depends_on:
      - relay
    networks:
      - rustdesk

  relay:
    image: docker.io/rustdesk/rustdesk-server-pro:latest
    container_name: rustdesk-relay
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: hbbr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rustdesk-relay
    command: hbbr
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/21117']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '21117:21117/tcp'
    volumes:
      - './volumes/data/relay:/root:z'
    networks:
      - rustdesk

networks:
  rustdesk:
    name: rustdesk
    external: false
